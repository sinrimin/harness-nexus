# Harness Nexus — cross-package task orchestration
# Usage:
#   task dev        # start all packages in watch mode (parallel)
#   task build      # build every package
#   task test       # run tests across packages
#   task lint       # lint everything
#   task format     # format with prettier
#   task clean      # remove build artifacts and node_modules
#
# Install task: https://taskfile.dev/installation/
# Prereq: run `pnpm install` first to populate workspace deps.

version: '3'

vars:
  PNPM: pnpm
  # CI parity gate: the workflow (.github/workflows/ci.yml) runs the quartet
  # below on Node 22.19 — the SERVER engine floor (>=22.19.0, #50; the five
  # published npm packages keep >=20). Dev machines usually run a newer Node,
  # whose EXTRA APIs mask floor-only code paths: a test guard that calls
  # `it.skip()` inside a running test once passed locally and errored in CI.
  # Point NODE22_BIN at a Node 22.19.x install to run the exact CI matrix
  # locally before pushing.
  NODE22_BIN: /opt/node-v22.19.0-linux-x64/bin

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  verify:
    desc: CI parity gate — build+typecheck+test under the Node 22.19 engine floor
    cmds:
      - test -x '{{.NODE22_BIN}}/node' || { echo "Node 22.19 toolchain missing at {{.NODE22_BIN}} — install one or override NODE22_BIN"; exit 1; }
      - 'PATH="{{.NODE22_BIN}}:{{.PATH}}" {{.PNPM}} -r run build'
      - 'PATH="{{.NODE22_BIN}}:{{.PATH}}" {{.PNPM}} -r run typecheck'
      - 'PATH="{{.NODE22_BIN}}:{{.PATH}}" {{.PNPM}} -r run test'

  install:
    desc: Install workspace dependencies
    cmds:
      - '{{.PNPM}} install --frozen-lockfile'

  install:dev:
    desc: Install workspace dependencies (dev, updates lockfile)
    cmds:
      - '{{.PNPM}} install'

  dev:
    desc: Start all packages in watch mode (parallel)
    cmds:
      - '{{.PNPM}} -r --parallel run dev'

  dev:server:
    desc: Start only the API server in watch mode
    cmds:
      - '{{.PNPM}} --filter @harness-nexus/server run dev'

  dev:web:
    desc: Start only the web SPA (Vite dev server)
    cmds:
      - '{{.PNPM}} --filter @harness-nexus/web run dev'

  build:
    desc: Build every package
    cmds:
      - '{{.PNPM}} -r run build'

  test:
    desc: Run tests across all packages
    cmds:
      - '{{.PNPM}} -r run test'

  typecheck:
    desc: Type-check every package
    cmds:
      - '{{.PNPM}} -r run typecheck'

  lint:
    desc: Lint every package
    cmds:
      - '{{.PNPM}} -r run lint'

  format:
    desc: Format the whole repo with Prettier
    cmds:
      - '{{.PNPM}} run format'

  format:check:
    desc: Check formatting without writing
    cmds:
      - '{{.PNPM}} run format:check'

  clean:
    desc: Remove build artifacts and node_modules
    cmds:
      - '{{.PNPM}} run clean'
