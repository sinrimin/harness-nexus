name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SPDX header gate (#74) — zero-dep, runs before install for fast feedback.
      - run: node scripts/headers.mjs --check

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          # The SERVER engine floor (packages/server engines >=22.19.0, #50) —
          # pinned ON the floor so newer-Node extras still fail here first.
          node-version: 22.19
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build before typecheck: cross-package project references need dist/.
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
