# Harness Nexus — nginx config for the web SPA + reverse proxy.
#
# Responsibilities:
#   1. Serve the built SPA (static assets).
#   2. Reverse-proxy /api and /mcp to the backend `server` service.
#   3. Harden the deployment (security headers, request limits, info hiding).
#
# The SPA calls same-origin (apps/web/src/api.ts: baseUrl defaults to ""), so
# the browser hits this nginx and it forwards /api + /mcp to the backend. No
# VITE_API_BASE_URL needed.

worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Hide the nginx version (defense through obscurity — reduces fingerprinting).
  server_tokens off;

  # --- sane defaults ---------------------------------------------------------
  # Browsers can cache 10s of state; we lean on per-location Cache-Control.
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Limit request body size. The largest legitimate upload is a skill bundle
  # (SKILL.md + references/ + scripts/); 10m is generous and caps DoS attempts.
  client_max_body_size 10m;
  # Drop slowloris-style clients that trickle headers/body.
  client_body_timeout 30s;
  client_header_timeout 30s;

  # --- gzip (compress text responses) ---------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    font/woff2;

  # --- upstream: the backend API server (compose service name `server`) -----
  upstream backend {
    server server:8080;
    keepalive 32;
  }

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- reverse proxy: REST API (/api) -------------------------------------
    # Standard request/response. The backend answers fast; short timeouts are
    # fine and prevent a wedged upstream from tying up nginx workers.
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    # --- marketplace emitter: token-in-path URLs ------------------------------
    # `/api/marketplace/<token>/...` embeds a bearer-equivalent PAT in the URL.
    # The backend masks it in ITS logs; nginx must not write it to the access
    # log either (#21). Longer prefix wins over `location /api/` above.
    location /api/marketplace/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      access_log off;
    }

    # --- health probe passthrough --------------------------------------------
    # The backend's liveness endpoint is /healthz (no /api prefix). Proxy it so
    # external monitors / load balancers can check the whole stack through one
    # port. Exact-match (`=`) wins over the SPA fallback in `location /`.
    location = /healthz {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      access_log off;
    }

    # --- reverse proxy: MCP transport (/mcp + /mcp/sse) ---------------------
    # CRITICAL: a plain `location /mcp` prefix match would ALSO capture the
    # SPA's own /mcp-servers page route and proxy it to the backend (refresh
    # there answered Fastify's 404 — #19; the Vite dev proxy guards the same
    # trap with a bypass). The regex matches only /mcp itself and /mcp/...,
    # letting /mcp-servers fall through to the SPA fallback below.
    #
    # CRITICAL #2: the backend uses reply.hijack() for raw streams, and
    # /mcp/sse is Server-Sent Events (a long-lived chunked stream). nginx MUST
    # NOT buffer it or the SSE events will be held until the buffer fills and
    # the client sees nothing in real time. The settings below are the standard
    # nginx recipe for SSE/WebSocket passthrough.
    location ~ ^/mcp(/|$) {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Clear the Connection header — don't let nginx inject "close" or reuse
      # an upstream keepalive conn for a stream it can't multiplex.
      proxy_set_header Connection "";

      # Disable ALL buffering for streaming responses.
      proxy_buffering off;
      proxy_cache off;
      # Tells any upstream-aware layer (and Fastify) not to buffer.
      add_header X-Accel-Buffering no always;

      # SSE connections are long-lived; don't cut them at the 60s default.
      proxy_connect_timeout 10s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
      # Let chunked transfer encoding pass through untouched.
      chunked_transfer_encoding on;
    }

    # --- reverse proxy: realtime channel (/socket.io) ------------------------
    # Socket.IO over WebSocket (Phase 8): the daemon's /ctl connection, the
    # browser's /app connection, and the chat streams all ride this path.
    # The Upgrade/Connection hop-by-hop headers are what turn the proxy into a
    # WebSocket tunnel; polling fallback also works over the same location.
    # Long timeouts: chat turns can stream for minutes on one connection.
    location /socket.io/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_connect_timeout 10s;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
    }

    # --- static assets (fingerprinted by Vite → safe to cache hard) ---------
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
      access_log off;
      try_files $uri =404;
    }

    # --- favicon / root-level static files ----------------------------------
    location = /favicon.svg {
      expires 1d;
      add_header Cache-Control "public";
      access_log off;
      try_files $uri =404;
    }

    # --- SPA fallback: serve index.html for any client-side route -----------
    # react-router (BrowserRouter) owns the URL; nginx must hand unknown paths
    # to the SPA so deep links / refreshes work. index.html itself is never
    # cached so a new deploy is picked up immediately.
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Frame-Options DENY always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
      # #21: CSP — everything the SPA needs is same-origin (fonts and assets are
      # self-hosted per the Signal design system). 'unsafe-inline' under
      # style-src covers React's style="" attributes only — script-src stays
      # strict (no inline/eval scripts exist).
      # #24: img-src data: = chat images (base64), blob: = local attachment
      # previews (URL.createObjectURL); font-src data: = fontsource's inlined
      # woff2 subsets.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
      try_files $uri $uri/ /index.html;
    }

    # Hide nginx-specific internals from error responses.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
