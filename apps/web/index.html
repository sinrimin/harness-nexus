<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11161f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Harness Nexus — a unified control plane for agent-tool assets. Aggregate upstream MCP servers once, re-expose one connection to every tool."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Harness Nexus</title>
    <script>
      // Skin pre-paint — sets <html data-skin> before first paint so a saved
      // skin never flashes the baseline. Keep the id list in sync with
      // apps/web/src/skins/registry.ts.
      try {
        var sk = localStorage.getItem('hnx.skin');
        if (sk !== 'bay' && sk !== 'ledger' && sk !== 'nightwatch') sk = 'signal';
        document.documentElement.dataset.skin = sk;
      } catch (e) {
        document.documentElement.dataset.skin = 'signal';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
